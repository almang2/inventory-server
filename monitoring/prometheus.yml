global:
  scrape_interval: 5s # 5초마다 수집

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: spring-app
    metrics_path: /actuator/prometheus
    static_configs:
      # macOS Docker에서 호스트 앱 접근 주소
      - targets: ["host.docker.internal:8080"]
